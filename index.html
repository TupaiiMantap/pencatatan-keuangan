<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-200 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel">


    // --- FIREBASE CONFIGURATION & CLOUD SERVICES ---
    const firebaseConfig = {
      apiKey: "AIzaSyBdeJ97ljgiKW3nLvvaCysMxgDVoSzAX58",
      authDomain: "finansialku-pro.firebaseapp.com",
      projectId: "finansialku-pro",
      storageBucket: "finansialku-pro.firebasestorage.app",
      messagingSenderId: "1087652448577",
      appId: "1:1087652448577:web:3676cad79d3ce96e8179c0"
    };

    // Initialize Firebase Services with Safe Fallback
    let firebaseApp = null;
    let firebaseAuth = null;
    let firebaseDb = null;

    try {
      if (typeof firebase !== 'undefined' && firebase.apps) {
        if (!firebase.apps.length) {
          firebaseApp = firebase.initializeApp(firebaseConfig);
        } else {
          firebaseApp = firebase.app();
        }
        firebaseAuth = firebase.auth();
        firebaseDb = firebase.firestore();

        // Enable offline persistence in Firestore if available
        try {
          firebaseDb.enablePersistence({ synchronizeTabs: true }).catch((err) => {
            if (err.code === 'failed-precondition' || err.code === 'unimplemented') {
              // Persistence could not be enabled in multiple tabs
            }
          });
        } catch (e) {}
      }
    } catch (err) {
      console.warn("Firebase initialization warning:", err);
    }

    // --- AUTHENTICATION SERVICE ---
    const authService = {
      isAvailable: () => !!firebaseAuth,
      
      onAuthStateChanged: (callback) => {
        if (!firebaseAuth) return () => {};
        return firebaseAuth.onAuthStateChanged(callback);
      },

      loginWithGoogle: async () => {
        if (!firebaseAuth) throw new Error("Firebase Auth belum tersedia");
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        return await firebaseAuth.signInWithPopup(provider);
      },

      loginWithEmail: async (email, password) => {
        if (!firebaseAuth) throw new Error("Firebase Auth belum tersedia");
        return await firebaseAuth.signInWithEmailAndPassword(email, password);
      },

      registerWithEmail: async (email, password, displayName) => {
        if (!firebaseAuth) throw new Error("Firebase Auth belum tersedia");
        const userCredential = await firebaseAuth.createUserWithEmailAndPassword(email, password);
        if (displayName && userCredential.user) {
          await userCredential.user.updateProfile({ displayName });
        }
        return userCredential;
      },

      loginAsGuest: async () => {
        if (!firebaseAuth) throw new Error("Firebase Auth belum tersedia");
        return await firebaseAuth.signInAnonymously();
      },

      logout: async () => {
        if (!firebaseAuth) return;
        return await firebaseAuth.signOut();
      },

      sendPasswordReset: async (email) => {
        if (!firebaseAuth) throw new Error("Firebase Auth belum tersedia");
        return await firebaseAuth.sendPasswordResetEmail(email);
      }
    };

    // --- FIRESTORE CLOUD SYNC SERVICE ---
    const cloudSyncService = {
      isAvailable: () => !!firebaseDb,

      // Save complete app data to user's Firestore document
      saveUserData: async (userId, payload) => {
        if (!firebaseDb || !userId) return false;
        try {
          const docRef = firebaseDb.collection('users').doc(userId);
          await docRef.set({
            ...payload,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastSyncDevice: navigator.userAgent
          }, { merge: true });
          return true;
        } catch (err) {
          console.error("Cloud save error:", err);
          return false;
        }
      },

      // Fetch user data from Firestore
      fetchUserData: async (userId) => {
        if (!firebaseDb || !userId) return null;
        try {
          const docRef = firebaseDb.collection('users').doc(userId);
          const docSnap = await docRef.get();
          if (docSnap.exists) {
            return docSnap.data();
          }
          return null;
        } catch (err) {
          console.error("Cloud fetch error:", err);
          return null;
        }
      },

      // Subscribe to real-time changes
      subscribeUserData: (userId, onDataUpdate) => {
        if (!firebaseDb || !userId) return () => {};
        const docRef = firebaseDb.collection('users').doc(userId);
        return docRef.onSnapshot((doc) => {
          if (doc.exists) {
            onDataUpdate(doc.data());
          }
        }, (err) => {
          console.error("Real-time sync snapshot error:", err);
        });
      }
    };

    // --- COMPONENT: AUTH & CLOUD SYNC MODAL ---
    function FirebaseAuthModal({ isOpen, onClose, onAuthSuccess, currentUser }) {
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register' | 'forgot'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [displayName, setDisplayName] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      if (!isOpen) return null;

      const handleGoogleLogin = async () => {
        setIsLoading(true);
        setErrorMsg('');
        try {
          const res = await authService.loginWithGoogle();
          onAuthSuccess(res.user);
          onClose();
        } catch (err) {
          setErrorMsg(err.message || 'Gagal masuk dengan akun Google.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleEmailAuth = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        setErrorMsg('');
        setSuccessMsg('');

        try {
          if (authMode === 'login') {
            const res = await authService.loginWithEmail(email, password);
            onAuthSuccess(res.user);
            onClose();
          } else if (authMode === 'register') {
            if (password.length < 6) {
              setErrorMsg('Kata sandi minimal 6 karakter!');
              setIsLoading(false);
              return;
            }
            const res = await authService.registerWithEmail(email, password, displayName);
            onAuthSuccess(res.user);
            onClose();
          } else if (authMode === 'forgot') {
            await authService.sendPasswordReset(email);
            setSuccessMsg('Email instruksi reset kata sandi telah dikirim!');
          }
        } catch (err) {
          let msg = err.message;
          if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
            msg = 'Email atau kata sandi tidak cocok.';
          } else if (err.code === 'auth/email-already-in-use') {
            msg = 'Email ini sudah terdaftar. Silakan gunakan menu Masuk.';
          } else if (err.code === 'auth/invalid-email') {
            msg = 'Format alamat email tidak valid.';
          }
          setErrorMsg(msg);
        } finally {
          setIsLoading(false);
        }
      };

      const handleGuestLogin = async () => {
        setIsLoading(true);
        setErrorMsg('');
        try {
          const res = await authService.loginAsGuest();
          onAuthSuccess(res.user);
          onClose();
        } catch (err) {
          setErrorMsg(err.message || 'Gagal masuk sebagai tamu.');
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4 select-none">
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-md shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
            
            {/* Header with Cloud Logo */}
            <div className="relative p-6 text-center border-b border-slate-100 dark:border-slate-800 bg-gradient-to-b from-slate-50 to-white dark:from-slate-800/40 dark:to-slate-900">
              <button
                onClick={onClose}
                className="absolute top-4 right-4 p-1 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg font-bold"
              >
                &times;
              </button>

              <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 via-orange-500 to-yellow-400 flex items-center justify-center text-white mx-auto shadow-lg shadow-orange-500/20 mb-3">
                <svg className="w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/>
                </svg>
              </div>

              <h3 className="font-extrabold text-lg text-slate-900 dark:text-slate-100">
                {authMode === 'login' ? 'Masuk ke FinansialKu Cloud' : authMode === 'register' ? 'Daftar Akun Baru' : 'Reset Kata Sandi'}
              </h3>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                Sinkronisasi data multi-perangkat real-time dengan Firebase Cloud Database
              </p>
            </div>

            {/* Content Body */}
            <div className="p-6 space-y-4">
              
              {/* Error or Success Alert */}
              {errorMsg && (
                <div className="p-3 text-xs font-semibold rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-900 text-rose-600 dark:text-rose-300">
                  {errorMsg}
                </div>
              )}
              {successMsg && (
                <div className="p-3 text-xs font-semibold rounded-xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-900 text-emerald-600 dark:text-emerald-300">
                  {successMsg}
                </div>
              )}

              {/* 1-Click Google Sign In */}
              {authMode !== 'forgot' && (
                <div className="space-y-3">
                  <button
                    type="button"
                    onClick={handleGoogleLogin}
                    disabled={isLoading}
                    className="w-full py-2.5 px-4 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 active:scale-[0.98] border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 shadow-sm transition-all flex items-center justify-center gap-2.5 disabled:opacity-50"
                  >
                    <svg className="w-4 h-4" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Lanjutkan dengan Google</span>
                  </button>

                  <div className="flex items-center gap-3 my-3">
                    <div className="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">atau dengan email</span>
                    <div className="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
                  </div>
                </div>
              )}

              {/* Form Email / Password */}
              <form onSubmit={handleEmailAuth} className="space-y-3">
                {authMode === 'register' && (
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                      Nama Lengkap
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="Contoh: Budi Santoso"
                      value={displayName}
                      onChange={(e) => setDisplayName(e.target.value)}
                      className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>
                )}

                <div>
                  <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                    Alamat Email
                  </label>
                  <input
                    type="email"
                    required
                    placeholder="nama@email.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                {authMode !== 'forgot' && (
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300">
                        Kata Sandi
                      </label>
                      {authMode === 'login' && (
                        <button
                          type="button"
                          onClick={() => setAuthMode('forgot')}
                          className="text-[10px] font-bold text-emerald-600 hover:underline"
                        >
                          Lupa kata sandi?
                        </button>
                      )}
                    </div>
                    <input
                      type="password"
                      required
                      placeholder="Minimal 6 karakter"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>
                )}

                <button
                  type="submit"
                  disabled={isLoading}
                  className="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white rounded-xl text-xs font-bold shadow-md shadow-emerald-600/20 transition-all disabled:opacity-50 flex items-center justify-center gap-2"
                >
                  {isLoading && <span className="animate-spin">⌛</span>}
                  <span>
                    {authMode === 'login' ? 'Masuk ke Akun' : authMode === 'register' ? 'Daftarkan Akun Baru' : 'Kirim Link Reset'}
                  </span>
                </button>
              </form>

              {/* Mode Switcher Links */}
              <div className="pt-2 text-center text-xs text-slate-500 dark:text-slate-400 space-y-1.5">
                {authMode === 'login' && (
                  <p>
                    Belum punya akun?{' '}
                    <button
                      type="button"
                      onClick={() => { setAuthMode('register'); setErrorMsg(''); setSuccessMsg(''); }}
                      className="font-bold text-emerald-600 hover:underline"
                    >
                      Daftar Gratis
                    </button>
                  </p>
                )}

                {authMode === 'register' && (
                  <p>
                    Sudah memiliki akun?{' '}
                    <button
                      type="button"
                      onClick={() => { setAuthMode('login'); setErrorMsg(''); setSuccessMsg(''); }}
                      className="font-bold text-emerald-600 hover:underline"
                    >
                      Masuk di sini
                    </button>
                  </p>
                )}

                {authMode === 'forgot' && (
                  <p>
                    Kembali ke{' '}
                    <button
                      type="button"
                      onClick={() => { setAuthMode('login'); setErrorMsg(''); setSuccessMsg(''); }}
                      className="font-bold text-emerald-600 hover:underline"
                    >
                      Halaman Masuk
                    </button>
                  </p>
                )}

                <div className="pt-2 border-t border-slate-100 dark:border-slate-800">
                  <button
                    type="button"
                    onClick={handleGuestLogin}
                    disabled={isLoading}
                    className="text-[11px] font-semibold text-slate-400 hover:text-slate-600 dark:hover:text-slate-300"
                  >
                    Atau masuk sebagai Tamu (Anonymous Cloud)
                  </button>
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    }


    // --- MODERN SVG ICONS ---
    const IconWallet = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
      </svg>
    );

    const IconTrendingUp = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
    );

    const IconTrendingDown = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
      </svg>
    );

    const IconArrowRightLeft = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
    );

    const IconBuildingBank = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 21h18M3 10h18M5 10v11m4-11v11m6-11v11m4-11v11M12 3l9 7H3l9-7z" />
      </svg>
    );

    const IconQrCode = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
      </svg>
    );

    const IconCreditCard = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <rect x="2" y="5" width="20" height="14" rx="2" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" />
        <line x1="2" y1="10" x2="22" y2="10" strokeWidth={2} />
      </svg>
    );

    // --- COMPONENT: MODAL SCAN STRUK BELANJA (OCR & PARSER) ---
    function ReceiptOCRModal({ isOpen, onClose, onApplyParsedData }) {
      const [imageFile, setImageFile] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState(0);
      const [rawText, setRawText] = useState('');
      const [parsedData, setParsedData] = useState({
        merchant: '',
        amount: '',
        date: '',
        category: 'Belanja',
        notes: ''
      });

      if (!isOpen) return null;

      // Smart Regex Parsing Function
      const parseReceiptText = (text) => {
        let detectedAmount = '';
        let detectedDate = '';
        let detectedMerchant = '';
        let detectedCategory = 'Belanja';

        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

        // 1. Merchant Detection (Check first 4 lines)
        for (let i = 0; i < Math.min(lines.length, 5); i++) {
          const line = lines[i];
          if (/indomaret/i.test(line)) { detectedMerchant = 'Indomaret'; detectedCategory = 'Belanja'; break; }
          if (/alfamart/i.test(line)) { detectedMerchant = 'Alfamart'; detectedCategory = 'Belanja'; break; }
          if (/pertamina|spbu/i.test(line)) { detectedMerchant = 'SPBU Pertamina'; detectedCategory = 'Transportasi'; break; }
          if (/starbucks|kopi|cafe|coffee/i.test(line)) { detectedMerchant = line; detectedCategory = 'Makanan & Minuman'; break; }
          if (/superindo|hypermart|transmart/i.test(line)) { detectedMerchant = line; detectedCategory = 'Belanja'; break; }
          if (/apotek|kimia farma/i.test(line)) { detectedMerchant = line; detectedCategory = 'Kesehatan'; break; }
          if (line.length > 3 && !/struk|nota|receipt|selamat|jalan|jl\./i.test(line) && !detectedMerchant) {
            detectedMerchant = line;
          }
        }
        if (!detectedMerchant && lines.length > 0) detectedMerchant = lines[0];

        // 2. Amount / Total Detection
        // Look for lines containing total, subtotal, bayar, rp, or find max price
        const amountsFound = [];
        const totalRegex = /(?:total|grand\s*total|tagihan|bayar|netto|jumlah|tunai|cash)\s*[:=]?\s*(?:rp\.?)?\s*([0-9]{1,3}(?:[.,][0-9]{3})*(?:[.,][0-9]{2})?|[0-9]+)/i;
        
        for (const line of lines) {
          const match = line.match(totalRegex);
          if (match && match[1]) {
            const clean = match[1].replace(/[^0-9]/g, '');
            if (clean && Number(clean) > 500) {
              amountsFound.push(Number(clean));
            }
          }
        }

        // If no direct total keyword match, scan for all currency-like numbers
        if (amountsFound.length === 0) {
          const numRegex = /(?:rp\.?\s*)?([0-9]{1,3}(?:[.,][0-9]{3})+)/gi;
          let m;
          while ((m = numRegex.exec(text)) !== null) {
            const clean = m[1].replace(/[^0-9]/g, '');
            if (Number(clean) >= 1000) amountsFound.push(Number(clean));
          }
        }

        if (amountsFound.length > 0) {
          // Take the highest reasonable number as the total
          detectedAmount = Math.max(...amountsFound).toString();
        }

        // 3. Date Detection (DD-MM-YYYY or YYYY-MM-DD or DD/MM/YY)
        const dateRegex = /(\d{1,2})[-/. ](\d{1,2}|Jan|Feb|Mar|Apr|Mei|Jun|Jul|Agu|Sep|Okt|Nov|Des)[-/. ](\d{2,4})/i;
        const dateMatch = text.match(dateRegex);
        if (dateMatch) {
          try {
            const today = new Date();
            const year = dateMatch[3].length === 2 ? '20' + dateMatch[3] : dateMatch[3];
            let month = dateMatch[2];
            const monthMap = { jan: '01', feb: '02', mar: '03', apr: '04', mei: '05', jun: '06', jul: '07', agu: '08', sep: '09', okt: '10', nov: '11', des: '12' };
            if (isNaN(month)) {
              month = monthMap[month.toLowerCase().substring(0, 3)] || '01';
            } else {
              month = month.padStart(2, '0');
            }
            const day = dateMatch[1].padStart(2, '0');
            detectedDate = `${year}-${month}-${day}`;
          } catch(e) {
            detectedDate = new Date().toISOString().split('T')[0];
          }
        } else {
          detectedDate = new Date().toISOString().split('T')[0];
        }

        // 4. Category refinement based on full text keywords
        const lower = text.toLowerCase();
        if (/kopi|coffee|cafe|resto|nasi|mie|burger|makan|teh|snack|drink|food/i.test(lower)) {
          detectedCategory = 'Makanan & Minuman';
        } else if (/spbu|bensin|pertamax|pertalite|solar|bbm|shell|parkir|toll/i.test(lower)) {
          detectedCategory = 'Transportasi';
        } else if (/pln|listrik|pdam|indihome|wifi|pulsa|paket data/i.test(lower)) {
          detectedCategory = 'Tagihan & Utilitas';
        } else if (/obat|vitamin|apotek|paracetamol|klinik|lab/i.test(lower)) {
          detectedCategory = 'Kesehatan';
        }

        return {
          merchant: detectedMerchant || 'Struk Belanja',
          amount: detectedAmount || '0',
          date: detectedDate || new Date().toISOString().split('T')[0],
          category: detectedCategory,
          notes: `Struk: ${detectedMerchant || 'Belanja'} (OCR Otomatis)`
        };
      };

      const handleImageUpload = (file) => {
        if (!file) return;
        setImageFile(file);
        const reader = new FileReader();
        reader.onload = (e) => {

        reader.readAsDataURL(file);

      const runOCR = async (imageSrc) => {
        setIsScanning(true);
        setScanProgress(10);
        try {
          if (window.Tesseract) {
            const worker = await Tesseract.createWorker('ind+eng', 1, {
              logger: m => {
                if (m.status === 'recognizing text') {
                  setScanProgress(Math.round(m.progress * 100));
                }
              }
            });
            const ret = await worker.recognize(imageSrc);
            await worker.terminate();
            setRawText(ret.data.text);
            const parsed = parseReceiptText(ret.data.text);
            setParsedData(parsed);
          } else {
            // Fallback simulation if offline

    // --- SUB-COMPONENT: MODAL TRANSFER ANTAR-AKUN ---
    function TransferModal({ accounts, initialFromId, onClose, onSaveTransfer }) {
      const [fromAccountId, setFromAccountId] = useState(initialFromId || (accounts[0] ? accounts[0].id : ''));
      const [toAccountId, setToAccountId] = useState(
        accounts.find(a => a.id !== (initialFromId || accounts[0]?.id))?.id || accounts[1]?.id || ''
      );
      const [amount, setAmount] = useState('');
      const [adminFee, setAdminFee] = useState('0');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [notes, setNotes] = useState('');

      const sourceAccount = accounts.find(a => a.id === fromAccountId);
      const destAccount = accounts.find(a => a.id === toAccountId);

      const handleSubmit = (e) => {
        e.preventDefault();
        const numAmount = Number(amount) || 0;
        const numFee = Number(adminFee) || 0;

        if (numAmount <= 0) {
          alert('Mohon masukkan nominal transfer yang valid!');
          return;
        }

        if (fromAccountId === toAccountId) {
          alert('Akun pengirim dan tujuan tidak boleh sama!');
          return;
        }

        if (sourceAccount && sourceAccount.balance < (numAmount + numFee)) {
          if (!window.confirm(`Peringatan: Saldo ${sourceAccount.name} (${formatIDR(sourceAccount.balance)}) kurang dari nominal transfer + biaya (${formatIDR(numAmount + numFee)}). Lanjutkan transfer?`)) {
            return;
          }
        }

        onSaveTransfer({
          fromAccountId,
          toAccountId,
          amount: numAmount,
          adminFee: numFee,
          date,
          notes: notes || `Transfer dari ${sourceAccount?.name} ke ${destAccount?.name}`
        });
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">

                  >

                        {acc.name} ({formatIDR(acc.balance)})

                </div>

                <div>

                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">

                  type="text"
                  placeholder="Contoh: Top-up e-wallet untuk belanja mingguan"

                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
              </div>

              <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                <button

                  onClick={onClose}

                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-500 rounded-xl shadow-md"

          </div>
        </div>
      );

    // --- SUB-COMPONENT: MODAL REKONSILIASI SALDO (PENYESUAIAN SALDO RIIL) ---

      const handleSubmit = (e) => {
        e.preventDefault();
        if (difference === 0) {
          alert('Saldo riil sama persis dengan saldo tercatat di aplikasi. Tidak diperlukan penyesuaian.');
          return;
        }

        onSaveReconciliation({
          accountId: account.id,
          recordedBalance,
          physicalBalance,
          difference,
          reason: reason || (difference > 0 ? 'Penyesuaian saldo riil lebih' : 'Penyesuaian saldo riil kurang'),
          date: new Date().toISOString().split('T')[0]
        });
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">

            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800">

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <p className="text-xs text-slate-500 dark:text-slate-400">

              <div className="bg-slate-50 dark:bg-slate-800/60 p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-700/60 space-y-2 text-xs">

                  <span className="text-slate-500">Saldo Tercatat di Aplikasi:</span>

                    {difference > 0 ? `+${formatIDR(difference)} (Kelebihan)` : difference < 0 ? `-${formatIDR(Math.abs(difference))} (Kekurangan)` : 'Rp 0 (Sesuai)'}

              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">

                </label>
                <input
                  type="text"

                  placeholder="Masukkan jumlah saldo fisik nyata"

    // --- COMPONENT: MODUL UTANG & PIUTANG TERPISAH (CICILAN & JATUH TEMPO) ---
    function DebtsView({
      debts,
      accounts,
      onAddDebt,
      onRecordPayment,
      onDeleteDebt
    }) {
      const [filterType, setFilterType] = useState('all'); // all, receivable, debt, unpaid, paid
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [payingDebt, setPayingDebt] = useState(null);

      // Aggregations
      const metrics = useMemo(() => {
        let totalReceivable = 0; // piutang kita (uang di luar)
        let totalDebt = 0; // utang kita (kewajiban)
        let totalReceivableRemaining = 0;
        let totalDebtRemaining = 0;
        let upcomingCount = 0;

        debts.forEach(d => {
          const remaining = Math.max(0, Number(d.totalAmount) - (Number(d.paidAmount) || 0));
          const days = getDaysDiff(d.dueDate);

          if (d.type === 'receivable') {
            totalReceivable += Number(d.totalAmount);
            totalReceivableRemaining += remaining;
          } else {
            totalDebt += Number(d.totalAmount);
            totalDebtRemaining += remaining;
          }

          if (remaining > 0 && days <= 7) {
            upcomingCount++;
          }
        });

        return {
          totalReceivable,
          totalDebt,
          totalReceivableRemaining,
          totalDebtRemaining,
          upcomingCount
        };
      }, [debts]);

      // Filtered debts
      const filteredDebts = useMemo(() => {
        return debts.filter(d => {
          const remaining = Math.max(0, Number(d.totalAmount) - (Number(d.paidAmount) || 0));
          const isSettled = remaining <= 0;

          if (filterType === 'receivable') return d.type === 'receivable';
          if (filterType === 'debt') return d.type === 'debt';
          if (filterType === 'unpaid') return !isSettled;
          if (filterType === 'paid') return isSettled;
          return true;
        });
      }, [debts, filterType]);

      return (
        <div className="space-y-6">
          
          {/* Top Summary Cards */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
            {/* Card 1: Piutang */}
            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">
                  Total Piutang Saya (Aset Tertagih)
                </span>
                <div className="p-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600">
                  <IconTrendingUp className="w-5 h-5" />
                </div>
              </div>
              <div className="mt-3">
                <div className="text-2xl font-black text-slate-900 dark:text-slate-100">
                  {formatIDR(metrics.totalReceivableRemaining)}
                </div>
                <p className="text-xs text-slate-400 mt-1">
                  Uang Anda yang dipinjam pihak lain (Sisa yang belum tertagih)
                </p>
              </div>
            </div>

            {/* Card 2: Utang */}
            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold uppercase tracking-wider text-rose-600 dark:text-rose-400">
                  Total Utang Saya (Kewajiban)
                </span>
                <div className="p-2 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-600">
                  <IconTrendingDown className="w-5 h-5" />
                </div>
              </div>
              <div className="mt-3">
                <div className="text-2xl font-black text-slate-900 dark:text-slate-100">
                  {formatIDR(metrics.totalDebtRemaining)}
                </div>
                <p className="text-xs text-slate-400 mt-1">
                  Sisa kewajiban yang wajib Anda bayarkan
                </p>
              </div>
            </div>

            {/* Card 3: Jatuh Tempo */}
            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400">
                  Pengingat Jatuh Tempo
                </span>
                <div className="p-2 rounded-xl bg-amber-50 dark:bg-amber-950/60 text-amber-600">
                  <IconAlertTriangle className="w-5 h-5" />
                </div>
              </div>
              <div className="mt-3">
                <div className="text-2xl font-black text-slate-900 dark:text-slate-100">
                  {metrics.upcomingCount} Transaksi
                </div>
                <p className="text-xs text-slate-400 mt-1">
                  Jatuh tempo dalam kurun waktu 7 hari ke depan atau sudah lewat
                </p>
              </div>
            </div>
          </div>

          {/* Action & Filter Bar */}
          <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm">
            <div className="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
              {[
                { id: 'all', label: 'Semua' },
                { id: 'receivable', label: 'Piutang (Uang di Luar)' },
                { id: 'debt', label: 'Utang (Kewajiban)' },
                { id: 'unpaid', label: 'Belum Lunas' },
                { id: 'paid', label: 'Sudah Lunas' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setFilterType(tab.id)}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors whitespace-nowrap ${
                    filterType === tab.id
                      ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900'
                      : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300 hover:bg-slate-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            <button
              onClick={() => setIsAddModalOpen(true)}
              className="flex items-center justify-center gap-1.5 px-4 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl shadow-md transition-all whitespace-nowrap"
            >
              <IconPlus className="w-4 h-4" />
              <span>Catat Utang / Piutang</span>
            </button>
          </div>

          {/* Debts List */}
          {filteredDebts.length === 0 ? (
            <div className="py-14 text-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-slate-400">
              <IconHandshake className="w-12 h-12 mx-auto mb-2 opacity-30" />
              <p className="font-semibold text-sm">Tidak ada catatan utang/piutang pada kriteria ini.</p>
              <p className="text-xs text-slate-400 mt-0.5">Gunakan tombol "Catat Utang / Piutang" untuk membuat catatan baru.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {filteredDebts.map(item => {
                const total = Number(item.totalAmount) || 0;
                const paid = Number(item.paidAmount) || 0;
                const remaining = Math.max(0, total - paid);
                const percent = total > 0 ? Math.min(100, Math.round((paid / total) * 100)) : 100;
                const isPaid = remaining <= 0;
                const isReceivable = item.type === 'receivable';
                const daysDiff = getDaysDiff(item.dueDate);

                let dueBadge = null;
                if (isPaid) {
                  dueBadge = <span className="px-2.5 py-0.5 text-[11px] font-bold rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300">Lunas</span>;
                } else if (daysDiff < 0) {
                  dueBadge = <span className="px-2.5 py-0.5 text-[11px] font-bold rounded-full bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300">Lewat {Math.abs(daysDiff)} Hari!</span>;

                  dueBadge = <span className="px-2.5 py-0.5 text-[11px] font-medium rounded-full bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400">{daysDiff} Hari Lagi</span>;

                    <div>
                      {/* Top Header */}
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <span className={`px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wider rounded-lg ${
                            isReceivable
                              ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'

          {/* MODAL TAMBAH UTANG / PIUTANG */}
          {isAddModalOpen && (
            <AddDebtModal
              onClose={() => setIsAddModalOpen(false)}
              onSave={(data) => {
                onAddDebt(data);
                setIsAddModalOpen(false);

            />

          {/* MODAL CATAT PEMBAYARAN CICILAN */}
          {payingDebt && (
            <DebtPaymentModal
              debt={payingDebt}
              accounts={accounts}
              onClose={() => setPayingDebt(null)}
              onSavePayment={(paymentData) => {
                onRecordPayment(payingDebt.id, paymentData);
                setPayingDebt(null);
              }}

          )}

    // --- SUB-COMPONENT: MODAL TAMBAH UTANG / PIUTANG ---

        e.preventDefault();

        if (!personName.trim() || amt <= 0 || !dueDate) {
          alert('Mohon lengkapi nama pihak, nominal, dan tanggal jatuh tempo!');
          return;
        }

        onSave({
          type,
          personName: personName.trim(),
          totalAmount: amt,
          paidAmount: 0,
          startDate,
          dueDate,
          notes: notes.trim(),
          status: 'unpaid',
          payments: []

              <div className="grid grid-cols-2 gap-2 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                <button

                  Piutang (Uang Saya Dipinjam)

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Nama Pihak / Peminjam *

                  type="text"
                  required
                  placeholder="Contoh: Rian Pratama, Budi Santoso, Toko Makmur"

                  onChange={(e) => setPersonName(e.target.value)}
                  className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Total Nominal Pokok (IDR) *
                </label>
                <input
                  type="text"
                  required
                  placeholder="Contoh: 1500000"
                  value={totalAmount}

              <div className="grid grid-cols-2 gap-3">
                <div>

                  />

                  <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">

        </div>
      );

    // --- SUB-COMPONENT: MODAL BAYAR / CICIL UTANG PIUTANG ---
    function DebtPaymentModal({ debt, accounts, onClose, onSavePayment }) {
      const remaining = Math.max(0, Number(debt.totalAmount) - (Number(debt.paidAmount) || 0));
      const [paymentAmount, setPaymentAmount] = useState(remaining.toString());
      const [paymentDate, setPaymentDate] = useState(new Date().toISOString().split('T')[0]);
      const [selectedAccountId, setSelectedAccountId] = useState(accounts[0] ? accounts[0].id : '');
      const [paymentNotes, setPaymentNotes] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        const amt = Number(paymentAmount) || 0;
        if (amt <= 0) {
          alert('Mohon masukkan nominal cicilan yang valid!');
          return;
        }
        if (amt > remaining) {
          alert(`Nominal pembayaran (${formatIDR(amt)}) melebihi sisa utang/piutang (${formatIDR(remaining)})!`);
          return;
        }

        onSavePayment({
          amount: amt,
          date: paymentDate,
          accountId: selectedAccountId,
          notes: paymentNotes || (debt.type === 'receivable' ? 'Penerimaan cicilan piutang' : 'Pembayaran cicilan utang')
        });
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800">
              <h3 className="font-bold text-base text-slate-800 dark:text-slate-100">
                {debt.type === 'receivable' ? 'Terima Pembayaran Piutang' : 'Bayar Cicilan Utang'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div className="bg-slate-50 dark:bg-slate-800/60 p-3 rounded-xl border border-slate-200/80 dark:border-slate-700/60 text-xs space-y-1">
                <div className="font-bold text-slate-800 dark:text-slate-200">{debt.personName}</div>
                <div className="flex justify-between text-slate-500">
                  <span>Sisa yang harus diselesaikan:</span>
                  <span className="font-bold text-emerald-600 dark:text-emerald-400">{formatIDR(remaining)}</span>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Nominal Pembayaran (IDR) *
                </label>
                <input
                  type="text"
                  required
                  value={paymentAmount}
                  onChange={(e) => setPaymentAmount(e.target.value.replace(/[^0-9]/g, ''))}
                  className="w-full px-3 py-2 text-base font-black rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
                {paymentAmount > 0 && <span className="text-[11px] text-slate-400 font-semibold">{formatIDR(paymentAmount)}</span>}
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                  {debt.type === 'receivable' ? 'Setor Uang Masuk ke Akun:' : 'Bayar dari Akun:'}
                </label>
                <select
                  value={selectedAccountId}
                  onChange={(e) => setSelectedAccountId(e.target.value)}
                  className="w-full px-3 py-2 text-xs font-semibold rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500"
                >
                  {accounts.map(acc => (
                    <option key={acc.id} value={acc.id}>
                      {acc.name} ({formatIDR(acc.balance)})
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Tanggal Pembayaran
                </label>
                <input
                  type="date"
                  value={paymentDate}
                  onChange={(e) => setPaymentDate(e.target.value)}
                  className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Catatan Pembayaran
                </label>
                <input
                  type="text"
                  placeholder="Contoh: Cicilan termin 2 via transfer"
                  value={paymentNotes}
                  onChange={(e) => setPaymentNotes(e.target.value)}
                  className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500"
                />
              </div>

              <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl shadow-md"
                >
                  Simpan Pembayaran
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- COMPONENT: AI INSIGHT & REKOMENDASI PINTAR WIDGET ---
    function AIInsightWidget({
      metrics,
      periodFilteredTransactions,
      categorySpending,
      goals,
      debts,
      filterPeriod
    }) {
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [randomTipIndex, setRandomTipIndex] = useState(0);

      // Financial intelligence calculations
      const insights = useMemo(() => {
        const totalInc = metrics.totalIncome || 0;
        const totalExp = metrics.totalExpense || 0;
        const net = totalInc - totalExp;

        // Savings Rate
        const savingsRate = totalInc > 0 ? Math.max(0, Math.round(((totalInc - totalExp) / totalInc) * 100)) : 0;

        // Top Category
        let topCategory = null;
        let topCategoryAmount = 0;
        Object.entries(categorySpending).forEach(([cat, amt]) => {
          if (amt > topCategoryAmount) {
            topCategory = cat;
            topCategoryAmount = amt;
          }
        });
        const topCatPercent = totalExp > 0 ? Math.round((topCategoryAmount / totalExp) * 100) : 0;

        // Daily Burn rate
        const daysInPeriod = filterPeriod === 'monthly' ? 30 : filterPeriod === 'yearly' ? 365 : 7;
        const dailyBurnRate = Math.round(totalExp / (daysInPeriod || 1));

        // Debts status
        const urgentDebts = debts.filter(d => {
          const rem = Math.max(0, Number(d.totalAmount) - (Number(d.paidAmount) || 0));
          const days = getDaysDiff(d.dueDate);
          return rem > 0 && d.type === 'debt' && days <= 7;
        });

        // Recommendations List
        const recommendations = [];

        // 1. Advice on Top Category
        if (topCategory && topCatPercent >= 30) {
          recommendations.push({
            type: 'warning',
            title: `Efisiensi Pos "${topCategory}"`,
            text: `Kategori ini menyerap ${topCatPercent}% (${formatIDR(topCategoryAmount)}) dari total belanja Anda. Disarankan pangkas pos sekunder hingga 10-15% untuk cadangan darurat.`
          });
        }

        // 2. Advice on Cashflow Surplus / Deficit
        if (net > 0) {
          const topGoal = goals.find(g => (Number(g.currentAmount) || 0) < (Number(g.targetAmount) || 0));
          if (topGoal) {
            const suggestedAlloc = Math.round(net * 0.4);
            recommendations.push({
              type: 'opportunity',
              title: `Peluang Akselerasi Goal: "${topGoal.name}"`,
              text: `Surplus arus kas periode ini mencapai ${formatIDR(net)}. Pertimbangkan untuk mengalokasikan ${formatIDR(suggestedAlloc)} langsung ke tabungan impian Anda!`
            });
          } else {
            recommendations.push({
              type: 'opportunity',
              title: 'Arus Kas Surplus Optimal',
              text: `Pertahankan tingkat rasio tabungan ${savingsRate}%. Dana mengendap dapat dialokasikan ke instrumen pasar uang atau deposito berbunga.`
            });
          }
        } else if (net < 0) {
          recommendations.push({
            type: 'alert',
            title: 'Arus Kas Defisit (Perlu Pengetatan)',
            text: `Pengeluaran melampaui pemasukan sebesar ${formatIDR(Math.abs(net))}. Tunda pengeluaran non-primer dan prioritaskan hanya kebutuhan pokok.`
          });
        }

        // 3. Advice on Debts Due Soon
        if (urgentDebts.length > 0) {
          recommendations.push({
            type: 'alert',
            title: 'Pengingat Pembayaran Utang',
            text: `Ada ${urgentDebts.length} kewajiban utang mendekati jatuh tempo dalam 7 hari. Amankan likuiditas di rekening utama Anda untuk menghindari denda!`
          });
        }

        // 4. Rule of Thumb Benchmark
        if (savingsRate >= 30) {
          recommendations.push({
            type: 'success',
            title: 'Pilar 50/30/20 Sangat Prima',

    // 1. FULL-SCREEN LOCK OVERLAY
    function LockScreenOverlay({ security, onUnlock, onResetPIN }) {
      const [inputPin, setInputPin] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [isBiometricScanning, setIsBiometricScanning] = useState(false);
      const [scanSuccess, setScanSuccess] = useState(false);

      if (!security.pinEnabled || !security.isLocked) return null;

      const targetLength = security.pinCode ? security.pinCode.length : 4;

      const handleDigitPress = (digit) => {
        if (inputPin.length < targetLength) {
          const newPin = inputPin + digit;
          setInputPin(newPin);
          setErrorMsg('');

          if (newPin.length === targetLength) {
            if (newPin === security.pinCode) {
              setTimeout(() => {
                onUnlock();
                setInputPin('');
              }, 200);
            } else {
              setTimeout(() => {
                setErrorMsg('PIN yang Anda masukkan salah!');
                setInputPin('');
              }, 300);
            }
          }
        }
      };

      const handleDelete = () => {
        setInputPin(prev => prev.slice(0, -1));
        setErrorMsg('');
      };

      // Mock Biometric Scanner Simulation
      const handleBiometricAuth = () => {
        setIsBiometricScanning(true);
        setErrorMsg('');
        setTimeout(() => {
          setIsBiometricScanning(false);
          setScanSuccess(true);
          setTimeout(() => {
            setScanSuccess(false);
            onUnlock();
            setInputPin('');
          }, 600);
        }, 1100);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-center p-4 select-none">
          <div className="w-full max-w-sm flex flex-col items-center text-center space-y-6">
            
            {/* Logo / Lock icon with pulse */}
            <div className="relative">
              <div className="w-20 h-20 rounded-3xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-2xl shadow-emerald-500/30">
                {scanSuccess ? (
                  <IconCheckCircle className="w-10 h-10 text-white animate-bounce" />
                ) : isBiometricScanning ? (
                  <IconFingerprint className="w-10 h-10 text-white animate-pulse" />
                ) : (
                  <IconLock className="w-10 h-10" />
                )}
              </div>
              {isBiometricScanning && (
                <div className="absolute inset-0 rounded-3xl border-2 border-teal-400 animate-ping pointer-events-none"></div>
              )}
            </div>

            <div>
              <h2 className="text-xl font-extrabold text-white tracking-tight">FinansialKu Terkunci</h2>
              <p className="text-xs text-slate-400 mt-1">
                {isBiometricScanning
                  ? 'Memindai biometrik (Face ID / Sidik Jari)...'
                  : scanSuccess
                  ? 'Biometrik terverifikasi!'
                  : 'Masukkan PIN keamanan untuk membuka aplikasi'}
              </p>
            </div>

            {/* PIN Dots Display */}
            <div className="flex items-center justify-center gap-3 my-2">
              {Array.from({ length: targetLength }).map((_, i) => (
                <div
                  key={i}
                  className={`w-3.5 h-3.5 rounded-full transition-all duration-200 ${
                    i < inputPin.length
                      ? 'bg-emerald-400 scale-125 shadow-lg shadow-emerald-400/50'
                      : 'border-2 border-slate-700 bg-slate-800'
                  }`}
                ></div>
              ))}
            </div>

            {/* Error Message */}
            {errorMsg && (
              <div className="text-xs font-bold text-rose-400 bg-rose-950/50 px-3 py-1.5 rounded-lg border border-rose-800">
                {errorMsg}
              </div>
            )}

            {/* Numeric Keypad Grid */}
            <div className="grid grid-cols-3 gap-3 w-64">
              {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => (
                <button
                  key={num}
                  type="button"
                  onClick={() => handleDigitPress(num.toString())}
                  className="w-16 h-16 rounded-2xl bg-slate-900 hover:bg-slate-800 active:scale-90 text-xl font-extrabold text-white border border-slate-800 shadow-md transition-all flex items-center justify-center mx-auto"
                >
                  {num}
                </button>
              ))}

              {/* Biometric Trigger */}
              <button
                type="button"
                onClick={handleBiometricAuth}
                title="Buka dengan Sidik Jari / Face ID"
                className="w-16 h-16 rounded-2xl bg-slate-900/60 hover:bg-slate-800 active:scale-90 text-emerald-400 border border-slate-800 transition-all flex items-center justify-center mx-auto"
              >
                <IconFingerprint className="w-7 h-7" />
              </button>

              {/* Digit 0 */}
              <button
                type="button"
                onClick={() => handleDigitPress('0')}
                className="w-16 h-16 rounded-2xl bg-slate-900 hover:bg-slate-800 active:scale-90 text-xl font-extrabold text-white border border-slate-800 shadow-md transition-all flex items-center justify-center mx-auto"
              >
                0
              </button>

              {/* Backspace */}
              <button
                type="button"
                onClick={handleDelete}
                className="w-16 h-16 rounded-2xl bg-slate-900/60 hover:bg-slate-800 active:scale-90 text-slate-400 hover:text-white border border-slate-800 transition-all flex items-center justify-center mx-auto"
              >
                &larr;
              </button>
            </div>

            {/* Biometric text button */}
            <button
              type="button"
              onClick={handleBiometricAuth}
              className="text-xs font-semibold text-emerald-400 hover:text-emerald-300 flex items-center gap-1.5 transition-colors"
            >
              <IconFingerprint className="w-4 h-4" />
              <span>Buka dengan Face ID / Sidik Jari</span>
            </button>

            {/* Reset PIN Fallback */}
            <button
              type="button"
              onClick={onResetPIN}
              className="text-[11px] text-slate-500 hover:text-slate-400 underline transition-colors"
            >
              Lupa PIN? Reset Kunci Pengaman
            </button>

          </div>
        </div>
      );
    }

    // --- CHART COMPONENT 1: BAR CHART (PEMASUKAN VS PENGELUARAN) ---
    function BarChartComponent({ transactions, filterPeriod, darkMode }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        let labels = [];
        let incomeData = [];
        let expenseData = [];

        if (filterPeriod === 'yearly') {
          labels = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
          incomeData = Array(12).fill(0);
          expenseData = Array(12).fill(0);

          transactions.forEach(t => {
            if (t.type === 'transfer' || t.type === 'adjustment') return;
            const m = new Date(t.date).getMonth();
            if (t.type === 'income') incomeData[m] += Number(t.amount);
            else expenseData[m] += Number(t.amount);
          });
        } else {
          let inc = 0;
          let exp = 0;
          transactions.forEach(t => {
            if (t.type === 'transfer' || t.type === 'adjustment') return;
            if (t.type === 'income') inc += Number(t.amount);
            else exp += Number(t.amount);
          });
          labels = ['Pemasukan', 'Pengeluaran'];
          incomeData = [inc, 0];
          expenseData = [0, exp];
        }

        const textColor = darkMode ? '#94a3b8' : '#64748b';
        const gridColor = darkMode ? '#1e293b' : '#f1f5f9';

        chartInstanceRef.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: filterPeriod === 'yearly' ? [
              {
                label: 'Pemasukan',
                data: incomeData,
                backgroundColor: '#10b981',
                borderRadius: 6,
              },
              {
                label: 'Pengeluaran',
                data: expenseData,
                backgroundColor: '#f43f5e',
                borderRadius: 6,
              }
            ] : [
              {
                label: 'Nominal (IDR)',
                data: [incomeData[0], expenseData[1]],
                backgroundColor: ['#10b981', '#f43f5e'],
                borderRadius: 8,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: filterPeriod === 'yearly',
                labels: { color: textColor, font: { family: 'Plus Jakarta Sans', size: 11 } }
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => ` ${ctx.dataset.label || ctx.label}: ${formatIDR(ctx.raw)}`
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: textColor, font: { family: 'Plus Jakarta Sans', size: 10 } }
              },
              y: {
                grid: { color: gridColor },
                ticks: {
                  color: textColor,
                  font: { family: 'Plus Jakarta Sans', size: 10 },
                  callback: (val) => val >= 1000000 ? `${val / 1000000} Jt` : val >= 1000 ? `${val / 1000} Rb` : val
                }
              }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [transactions, filterPeriod, darkMode]);

      return <canvas ref={canvasRef} className="w-full h-full" />;
    }

    // --- CHART COMPONENT 2: DOUGHNUT CHART (KATEGORI PENGELUARAN) ---
    function PieChartComponent({ categorySpending, darkMode }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const labels = Object.keys(categorySpending);
        const data = Object.values(categorySpending);

        if (labels.length === 0 || data.reduce((a, b) => a + b, 0) === 0) {
          labels.push('Belum ada pengeluaran');
          data.push(1);
        }

        const modernPalette = [
          '#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6',
          '#06b6d4', '#10b981', '#f59e0b', '#f97316', '#64748b'
        ];

        const textColor = darkMode ? '#cbd5e1' : '#475569';

        chartInstanceRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: data,
              backgroundColor: labels[0] === 'Belum ada pengeluaran' ? ['#e2e8f0'] : modernPalette.slice(0, labels.length),
              borderWidth: 2,
              borderColor: darkMode ? '#0f172a' : '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '68%',
            plugins: {
              legend: {
                position: 'right',
                labels: {
                  color: textColor,
                  font: { family: 'Plus Jakarta Sans', size: 10 },
                  boxWidth: 12,
                  padding: 8
                }
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => ` ${ctx.label}: ${formatIDR(ctx.raw)}`
                }
              }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [categorySpending, darkMode]);

      return <canvas ref={canvasRef} className="w-full h-full" />;
    }

    // --- CHART COMPONENT 3: YEARLY TREND LINE CHART ---
    function YearlyTrendChart({ transactions, year, darkMode }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const incomeMonthly = Array(12).fill(0);
        const expenseMonthly = Array(12).fill(0);

        transactions.forEach(t => {
          if (!t.date || t.type === 'transfer' || t.type === 'adjustment') return;
          const [y, m] = t.date.split('-').map(Number);
          if (y === Number(year)) {
            const monthIdx = m - 1;
            if (monthIdx >= 0 && monthIdx < 12) {
              if (t.type === 'income') {
                incomeMonthly[monthIdx] += Number(t.amount);
              } else {
                expenseMonthly[monthIdx] += Number(t.amount);
              }
            }
          }
        });

        const textColor = darkMode ? '#94a3b8' : '#64748b';
        const gridColor = darkMode ? '#1e293b' : '#f1f5f9';

        chartInstanceRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: months,
            datasets: [
              {
                label: 'Pemasukan',
                data: incomeMonthly,
                borderColor: '#10b981',
                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                fill: true,
                tension: 0.35,
                borderWidth: 2.5,
                pointRadius: 4,
                pointBackgroundColor: '#10b981'
              },
              {
                label: 'Pengeluaran',
                data: expenseMonthly,
                borderColor: '#f43f5e',
                backgroundColor: 'rgba(244, 63, 94, 0.08)',
                fill: true,
                tension: 0.35,
                borderWidth: 2.5,
                pointRadius: 4,
                pointBackgroundColor: '#f43f5e'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'top',
                labels: { color: textColor, font: { family: 'Plus Jakarta Sans', size: 11 } }
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => ` ${ctx.dataset.label}: ${formatIDR(ctx.raw)}`
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: textColor, font: { family: 'Plus Jakarta Sans', size: 10 } }
              },
              y: {
                grid: { color: gridColor },
                ticks: {
                  color: textColor,
                  font: { family: 'Plus Jakarta Sans', size: 10 },
                  callback: (val) => val >= 1000000 ? `${val / 1000000} Jt` : val >= 1000 ? `${val / 1000} Rb` : val
                }
              }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [transactions, year, darkMode]);

      return <canvas ref={canvasRef} className="w-full h-full" />;
    }

    // --- COMPONENT: MODAL ATUR ANGGARAN (BUDGET) ---
    function BudgetModal({ budgets, categories, onClose, onSave }) {
      const [formData, setFormData] = useState({ ...budgets });

      const handleChange = (cat, val) => {
        const clean = val.replace(/[^0-9]/g, '');
        setFormData(prev => ({
          ...prev,
          [cat]: Number(clean) || 0
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800">
              <h3 className="font-bold text-base text-slate-800 dark:text-slate-100">
                Atur Target Anggaran Bulanan
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <p className="text-xs text-slate-500">
                Masukkan batas pengeluaran maksimal (Rupiah) untuk setiap kategori di bawah:
              </p>

              <div className="max-h-80 overflow-y-auto space-y-3 pr-1">
                {categories.map((cat) => (
                  <div key={cat} className="flex items-center justify-between gap-3">
                    <label className="text-xs font-bold text-slate-700 dark:text-slate-300 w-1/2">
                      {cat}
                    </label>
                    <div className="relative w-1/2">
                      <span className="absolute inset-y-0 left-0 pl-2.5 flex items-center text-xs font-semibold text-slate-400">
                        Rp
                      </span>
                      <input
                        type="text"
                        placeholder="0"
                        value={formData[cat] ? formData[cat].toString() : ''}
                        onChange={(e) => handleChange(cat, e.target.value)}
                        className="w-full pl-8 pr-3 py-1.5 text-xs font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>
                  </div>
                ))}
              </div>

              <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 rounded-xl"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl shadow-md"
                >
                  Simpan Anggaran
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }


    // --- COMPONENT: MODAL FORM TRANSAKSI LENGKAP (DENGAN AKUN & OCR SHORTCUT) ---
    function TransactionModal({
      editingTx,
      accounts,
      categories,
      paymentMethods,
      onClose,
      onSave,
      onAddCategory,
      onOpenOCR
    }) {
      const [type, setType] = useState(editingTx ? editingTx.type : 'expense');
      const [accountId, setAccountId] = useState(editingTx?.accountId || (accounts[0] ? accounts[0].id : ''));
      const [amount, setAmount] = useState(editingTx ? editingTx.amount.toString() : '');
      const [displayAmount, setDisplayAmount] = useState(editingTx ? formatIDR(editingTx.amount) : '');
      const [date, setDate] = useState(editingTx ? editingTx.date : new Date().toISOString().split('T')[0]);
      const [time, setTime] = useState(editingTx ? editingTx.time : new Date().toTimeString().slice(0, 5));
      const [category, setCategory] = useState(
        editingTx ? editingTx.category : (type === 'income' ? categories.income[0] : categories.expense[0])
      );
      const [paymentMethod, setPaymentMethod] = useState(editingTx ? editingTx.paymentMethod : paymentMethods[0]);
      const [cycle, setCycle] = useState(editingTx ? editingTx.cycle : 'Sekali Jalan');
      const [notes, setNotes] = useState(editingTx ? editingTx.notes : '');

      const [isAddingNewCat, setIsAddingNewCat] = useState(false);
      const [newCatName, setNewCatName] = useState('');

      const handleTypeChange = (newType) => {
        setType(newType);
        if (!editingTx) {
          setCategory(newType === 'income' ? categories.income[0] : categories.expense[0]);
        }
      };

      const handleAmountChange = (raw) => {
        const cleanNumber = raw.replace(/[^0-9]/g, '');
        setAmount(cleanNumber);
        setDisplayAmount(cleanNumber ? formatIDR(cleanNumber) : '');
      };

      const handleQuickAddAmount = (addValue) => {
        const current = Number(amount) || 0;
        const total = current + addValue;
        setAmount(total.toString());
        setDisplayAmount(formatIDR(total));
      };

      const handleCreateCategory = (e) => {
        e.preventDefault();
        if (newCatName.trim()) {
          onAddCategory(type, newCatName.trim());
          setCategory(newCatName.trim());
          setNewCatName('');
          setIsAddingNewCat(false);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!amount || Number(amount) <= 0) {
          alert('Mohon masukkan jumlah nominal yang valid!');
          return;
        }

        onSave({
          type,
          accountId,
          amount: Number(amount),
          date,
          time,
          category,
          paymentMethod,
          cycle,
          notes
        });
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
            
            {/* Header */}
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800">
              <div className="flex items-center gap-2">
                <h3 className="font-bold text-base text-slate-800 dark:text-slate-100">
                  {editingTx ? 'Edit Catatan Transaksi' : 'Tambah Transaksi Baru'}
                </h3>
              </div>
              
              <div className="flex items-center gap-2">
                {!editingTx && (
                  <button
                    type="button"
                    onClick={onOpenOCR}
                    className="flex items-center gap-1 px-2.5 py-1 text-[11px] font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 rounded-lg transition-colors border border-emerald-200 dark:border-emerald-800"
                  >
                    <IconCameraScan className="w-3.5 h-3.5" />
                    <span>Scan Struk (OCR)</span>
                  </button>
                )}
                <button
                  onClick={onClose}
                  className="text-slate-400 hover:text-slate-600 text-lg font-bold"
                >
                  &times;
                </button>
              </div>
            </div>

            {/* Form */}
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              
              {/* Type Switcher: Pemasukan vs Pengeluaran */}
              <div className="grid grid-cols-2 gap-2 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl">
                <button
                  type="button"
                  onClick={() => handleTypeChange('expense')}
                  className={`py-2 text-xs font-bold rounded-lg transition-all ${
                    type === 'expense'
                      ? 'bg-rose-600 text-white shadow-md'
                      : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'
                  }`}
                >
                  Pengeluaran
                </button>
                <button
                  type="button"
                  onClick={() => handleTypeChange('income')}
                  className={`py-2 text-xs font-bold rounded-lg transition-all ${
                    type === 'income'
                      ? 'bg-emerald-600 text-white shadow-md'
                      : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'
                  }`}
                >
                  Pemasukan
                </button>
              </div>

              {/* Account Selection */}
              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Wadah / Akun Keuangan *
                </label>
                <select
                  value={accountId}
                  onChange={(e) => setAccountId(e.target.value)}
                  className="w-full px-3 py-2 text-xs font-semibold rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                >
                  {accounts.map(acc => (
                    <option key={acc.id} value={acc.id}>
                      {acc.name} — Saldo: {formatIDR(acc.balance)}
